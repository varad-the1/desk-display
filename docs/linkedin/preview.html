<!doctype html><meta charset="utf-8"><title>LinkedIn post preview</title><style>
body{margin:0;background:#f3f2ef;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#191919}
.row{display:flex;gap:24px;max-width:1500px;margin:24px auto;padding:0 24px;align-items:flex-start}
.card{background:#fff;border:1px solid #d9d9d9;border-radius:10px;padding:20px}
.txt{flex:0 0 520px}.txt pre{white-space:pre-wrap;font:inherit;font-size:15px;line-height:1.5;margin:0}
.img{flex:1}.img img{width:100%;border-radius:8px;display:block;margin-bottom:12px}
h2{font-size:13px;letter-spacing:.08em;color:#666;margin:0 0 12px}
</style><div class="row"><div class="card txt"><h2>POST TEXT</h2><pre id="p"></pre></div>
<div class="card img"><h2>IMAGES (SIDE BY SIDE)</h2><img src="sidebyside.png"><img src="../screenshots/00-overview.png"></div></div>
<script>fetch("post.md").then(r=>r.text()).then(t=>document.getElementById("p").textContent=t).catch(()=>{document.getElementById("p").textContent="Open via a local server to load post.md"})</script>
